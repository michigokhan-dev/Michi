
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>Reset Password | MICHI</title>
  <link rel="icon" href="./michi_goldbox_icon_192.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
    }
    .gold { color: #D4AF37; }
    .field {
      width: 100%;
      box-sizing: border-box;
      background: #0b0b0b;
      color: #fff;
      border: 1px solid #39301b;
      border-radius: 10px;
      padding: 13px;
      outline: none;
    }
    .field:focus { border-color: #D4AF37; }
    .gold-button {
      width: 100%;
      background: #D4AF37;
      color: #000;
      padding: 14px;
      border-radius: 10px;
      font-weight: bold;
    }
    .gold-button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }
    .password-wrap { position: relative; }
    .password-wrap input { padding-right: 72px; }
    .toggle {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: #D4AF37;
      font-size: 13px;
      background: transparent;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center px-5 py-10">
  <main class="w-full max-w-md">
    <header class="text-center mb-8">
      <img src="./michi_goldbox_icon_192.png"
           alt="MICHI logo"
           class="w-20 h-20 object-contain mx-auto mb-4">
      <h1 class="gold text-3xl tracking-[0.3em] font-bold">MICHI</h1>
      <h2 class="text-xl mt-8">Create a new password</h2>
      <p class="text-gray-400 text-sm mt-3">
        Enter your new password below.
      </p>
    </header>

    <form id="resetForm" class="space-y-4">
      <div class="password-wrap">
        <input id="password" class="field" type="password"
               placeholder="New password"
               autocomplete="new-password"
               minlength="8" required>
        <button class="toggle" type="button"
                data-target="password">Show</button>
      </div>

      <div class="password-wrap">
        <input id="confirmPassword" class="field" type="password"
               placeholder="Confirm new password"
               autocomplete="new-password"
               minlength="8" required>
        <button class="toggle" type="button"
                data-target="confirmPassword">Show</button>
      </div>

      <p class="text-gray-400 text-xs">
        Password must be at least 8 characters.
      </p>

      <p id="message" class="text-sm"
         role="status" aria-live="polite"></p>

      <button id="saveButton" type="submit" class="gold-button">
        Update Password
      </button>
    </form>

    <p class="text-center mt-6">
      <a href="./signin.html" class="gold underline">Back to Sign In</a>
    </p>
  </main>

  <script type="module">
    import { createClient } from
      'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    const SUPABASE_URL = 'https://txfusknysukvfujpiemi.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_F6BDYU87xNKou69jz6JnLA_GkU7c1x_';

    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);
    const form = document.getElementById('resetForm');
    const message = document.getElementById('message');
    const button = document.getElementById('saveButton');

    document.querySelectorAll('.toggle').forEach((toggle) => {
      toggle.addEventListener('click', () => {
        const input = document.getElementById(toggle.dataset.target);
        const showing = input.type === 'text';
        input.type = showing ? 'password' : 'text';
        toggle.textContent = showing ? 'Show' : 'Hide';
      });
    });

    let recoveryReady = false;

    function showMessage(text, isError = false) {
      message.textContent = text;
      message.className = isError
        ? 'text-sm text-red-400'
        : 'text-sm gold';
    }

    supabase.auth.onAuthStateChange((event, session) => {
      if (event === 'PASSWORD_RECOVERY' || session) {
        recoveryReady = true;
      }
    });

    // Allow Supabase time to process the recovery link.
    setTimeout(async () => {
      const { data } = await supabase.auth.getSession();

      if (data.session) {
        recoveryReady = true;
      }

      if (!recoveryReady) {
        showMessage(
          'Please open the password reset link from your email again.',
          true
        );
        button.disabled = true;
      }
    }, 1000);

    form.addEventListener('submit', async (event) => {
      event.preventDefault();

      const password = document.getElementById('password').value;
      const confirmPassword =
        document.getElementById('confirmPassword').value;

      if (password.length < 8) {
        showMessage('Password must be at least 8 characters.', true);
        return;
      }

      if (password !== confirmPassword) {
        showMessage('The passwords do not match.', true);
        return;
      }

      button.disabled = true;
      button.textContent = 'Updating...';

      try {
        const { data } = await supabase.auth.getSession();

        if (!data.session) {
          throw new Error(
            'Your reset link is invalid or expired. Please request a new one.'
          );
        }

        const { error } = await supabase.auth.updateUser({ password });

        if (error) throw error;

        showMessage('Password updated successfully. Redirecting to sign in...');

        await supabase.auth.signOut();

        setTimeout(() => {
          window.location.href = './signin.html';
        }, 1500);
      } catch (error) {
        showMessage(
          error.message || 'Unable to update password.',
          true
        );
        button.disabled = false;
        button.textContent = 'Update Password';
      }
    });
  </script>
</body>
</html>
