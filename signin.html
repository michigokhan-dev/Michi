
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>Sign In | MICHI</title>
  <link rel="icon" href="./michi_goldbox_icon_192.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background:#000; color:#fff; font-family:Arial,sans-serif; }
    .gold { color:#D4AF37; }
    .field {
      width:100%; background:#0b0b0b; color:#fff;
      border:1px solid #39301b; border-radius:10px;
      padding:13px; outline:none;
    }
    .field:focus { border-color:#D4AF37; }
    .gold-button {
      width:100%; background:#D4AF37; color:#000;
      padding:14px; border-radius:10px; font-weight:bold;
    }
    .gold-button:disabled { opacity:.6; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center px-5 py-10">
  <main class="w-full max-w-md">
    <header class="text-center mb-8">
      <img src="./michi_goldbox_icon_192.png" alt="MICHI logo"
           class="w-20 h-20 object-contain mx-auto mb-4">
      <h1 class="gold text-3xl tracking-[0.3em] font-bold">MICHI</h1>
      <p class="text-gray-400 mt-2">Black background. Gold soul.</p>
      <h2 class="text-xl mt-8">Welcome back</h2>
    </header>

    <form id="signinForm" class="space-y-4">
      <input id="email" class="field" type="email"
             placeholder="Email address" autocomplete="email" required>

      <div class="relative">
        <input id="password" class="field pr-20" type="password"
               placeholder="Password" autocomplete="current-password"
               required>
        <button type="button" id="togglePassword"
          class="absolute right-3 top-1/2 -translate-y-1/2 gold text-sm">
          Show
        </button>
      </div>

      <div class="text-right">
        <a href="./forgot-password.html" class="gold text-sm underline">
          Forgot Password?
        </a>
      </div>

      <p id="message" class="text-sm" role="status" aria-live="polite"></p>

      <button id="signinButton" type="submit" class="gold-button">
        Sign In
      </button>
    </form>

    <p class="text-center text-gray-400 mt-6">
      Don't have an account?
      <a href="./signup.html" class="gold underline">Create account</a>
    </p>
  </main>

  <script type="module">
    import { createClient } from
      'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    // Use the same URL and Publishable key as signup.html.
    const SUPABASE_URL = 'YOUR_SUPABASE_PROJECT_URL';
    const SUPABASE_KEY = 'YOUR_SUPABASE_PUBLISHABLE_KEY';

    const form = document.getElementById('signinForm');
    const message = document.getElementById('message');
    const button = document.getElementById('signinButton');

    document.getElementById('togglePassword').addEventListener('click', () => {
      const password = document.getElementById('password');
      const toggle = document.getElementById('togglePassword');
      const showing = password.type === 'text';
      password.type = showing ? 'password' : 'text';
      toggle.textContent = showing ? 'Show' : 'Hide';
    });

    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      message.textContent = '';
      message.className = 'text-sm';
      button.disabled = true;
      button.textContent = 'Signing in...';

      try {
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        const { error } = await supabase.auth.signInWithPassword({
          email,
          password
        });

        if (error) throw error;

        window.location.href = './index.html';
      } catch (error) {
        message.textContent = error.message || 'Unable to sign in.';
        message.className = 'text-sm text-red-400';
      } finally {
        button.disabled = false;
        button.textContent = 'Sign In';
      }
    });
  </script>
</body>
</html>
