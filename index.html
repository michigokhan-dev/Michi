<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MİCHİ — Private Atelier</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#050505;color:#fff;font-family:'Inter',sans-serif;min-height:100vh}
.header{position:sticky;top:0;z-index:40;height:70px;background:#0a0a0a;border-bottom:1px solid #1e1e1e;display:flex;align-items:center;justify-content:space-between;padding:0 20px}
.brand{display:flex;align-items:center;gap:14px}
.brand-logo{height:36px;width:36px;background:linear-gradient(180deg,#FFD700,#D4AF37,#8B6914);-webkit-background-clip:text;color:transparent;font-weight:900;font-size:32px;display:flex;align-items:center;justify-content:center;text-shadow:0 0 15px rgba(212,175,55,0.5)}
.brand-title{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:600;letter-spacing:.18em;color:#D4AF37;line-height:1}
.brand-line{height:1px;width:100%;background:linear-gradient(to right,#D4AF37,rgba(212,175,55,.1));margin:3px 0 4px}
.brand-subtitle{font-size:10px;letter-spacing:.28em;color:#8B7355;text-transform:uppercase}
.header-actions{display:flex;gap:12px;align-items:center}
.icon-btn{position:relative;width:40px;height:40px;border-radius:50%;background:#1a1a1a;border:1px solid rgba(212,175,55,.2);display:flex;align-items:center;justify-content:center;cursor:pointer}
.icon-btn .dot{position:absolute;top:7px;right:8px;width:7px;height:7px;background:#D4AF37;border-radius:50%;box-shadow:0 0 6px rgba(212,175,55,.8)}
.avatar-btn{width:40px;height:40px;border-radius:50%;background:#1a1a1a;border:1.5px solid #D4AF37;color:#D4AF37;font-size:13px;font-weight:600;cursor:pointer}
.search-wrap{background:#050505;padding:16px 20px}
.search-box{max-width:600px;margin:0 auto;position:relative;width:100%}
.search-icon{position:absolute;left:16px;top:50%;transform:translateY(-50%)}
.search-box input{width:100%;height:44px;background:#121212;border:1px solid #2a2a2a;border-radius:999px;padding:0 70px 0 44px;color:#ddd;font-size:14px;outline:none}
.search-box input:focus{border-color:rgba(212,175,55,.35);background:#141414}
.clear-btn{position:absolute;right:16px;top:50%;transform:translateY(-50%);background:none;border:none;color:#555;font-size:12px;cursor:pointer}
.main{padding:0 20px 80px}
.container{max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.card{background:#0f0f0f;border:1px solid rgba(212,175,55,.15);border-radius:20px;padding:32px;position:relative;overflow:hidden}
.profile-card{display:flex;flex-direction:column;align-items:center;text-align:center}
.avatar-large{position:relative;width:80px;height:80px;border-radius:50%;background:#1a1a1a;border:2px solid #D4AF37;color:#D4AF37;font-size:24px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 0 30px rgba(212,175,55,.18)}
.online-badge{position:absolute;bottom:-4px;right:-4px;width:20px;height:20px;border-radius:50%;background:#0f0f0f;border:1px solid #1e1e1e;display:flex;align-items:center;justify-content:center}
.online-badge i{width:10px;height:10px;border-radius:50%;background:#D4AF37;display:block;box-shadow:0 0 6px rgba(212,175,55,.8)}
.profile-name{margin-top:20px;display:flex;align-items:center;gap:8px}
.profile-name h1{font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:500}
.verified{width:18px;height:18px;border-radius:50%;background:#D4AF37;display:flex;align-items:center;justify-content:center}
.handle{color:#D4AF37;font-size:14px;margin-top:4px}
.bio{color:#666;font-size:13px;line-height:1.6;max-width:320px;margin-top:16px}
.divider{width:100%;height:1px;background:#222;margin:24px 0}
.stats{width:100%;display:grid;grid-template-columns:1fr 1fr 1fr}
.stats div{display:flex;flex-direction:column;align-items:center;gap:4px}
.stats div:not(:last-child){border-right:1px solid #1e1e1e}
.stat-num{font-size:18px;font-weight:600}
.stat-num.gold{color:#D4AF37;font-family:'Cormorant Garamond',serif}
.stat-label{color:#666;font-size:10px;letter-spacing:.18em;text-transform:uppercase}
.inner-card{padding:20px}
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.card-header h2{color:#D4AF37;font-size:12px;letter-spacing:.2em;text-transform:uppercase;font-weight:500}
.badge{background:#1a1a1a;border:1px solid rgba(212,175,55,.2);color:#D4AF37;font-size:10px;letter-spacing:.15em;text-transform:uppercase;padding:4px 12px;border-radius:999px}
.member-row{width:100%;display:flex;align-items:center;gap:12px;padding:14px 8px;border-bottom:1px solid #1a1a1a;background:none;border-left:none;border-right:none;border-top:none;text-align:left;cursor:pointer;border-radius:12px}
.member-row:hover{background:#121212}
.member-avatar{flex-shrink:0;width:36px;height:36px;border-radius:50%;background:#1a1a1a;border:1px solid rgba(212,175,55,.2);color:#D4AF37;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center}
.member-info{flex:1;min-width:0}
.member-name{color:#fff;font-size:14px;font-weight:500}
.member-role{color:#666;font-size:12px;margin-top:1px}
.online-dot{width:7px;height:7px;border-radius:50%;background:#D4AF37;box-shadow:0 0 8px rgba(212,175,55,.6)}
.card-footer{margin-top:16px;padding-top:16px;border-top:1px solid #1a1a1a;display:flex;justify-content:space-between;font-size:11px;color:#444}
.footnote{text-align:center;color:#2a2a2a;font-size:10px;letter-spacing:.2em;text-transform:uppercase;padding-top:8px}
.modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.8);backdrop-filter:blur(4px);display:flex;justify-content:center;align-items:flex-end}
.modal.hidden{display:none}
.modal-box{width:100%;max-width:380px;background:#121212;border:1px solid rgba(212,175,55,.2);border-radius:28px 28px 0 0;padding:28px}
.drag{width:40px;height:4px;background:#2a2a2a;border-radius:999px;margin:0 auto 24px}
  </style>
</head>
<body>
<header class="header">
<div class="brand">
<div class="brand-logo">M</div>
<div class="brand-text"><span class="brand-title">MİCHİ</span><div class="brand-line"></div><span class="brand-subtitle">PRIVATE ATELIER</span></div>
</div>
<div class="header-actions">
<button id="notifBtn" class="icon-btn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#D4AF37" stroke-width="1.5"><path d="M6 8a6 6 0 0 1 12 0c0 7 6 5 6 10H0s6-3 6-10"/><path d="M10 20a2 2 0 0 0 4 0"/></svg><span class="dot"></span></button>
<button id="profileBtn" class="avatar-btn">AM</button>
</div>
</header>
<div class="search-wrap"><div class="search-box"><svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#555" stroke-width="1.6"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="searchInput" type="text" placeholder="Search atelier..."><button id="clearSearch" class="clear-btn" style="display:none">CLEAR</button></div></div>
<main class="main"><div class="container">
<section class="card profile-card"><button class="avatar-large">AM<span class="online-badge"><i></i></span></button><div class="profile-name"><h1>Alessandro M.</h1><span class="verified"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#050505" stroke-width="3"><path d="M5 12l5 5l10 -10"/></svg></span></div><p class="handle">@michi_alessandro</p><p class="bio">Founder's Circle • Atelier Black • Building the most private luxury network.</p><div class="divider"></div><div class="stats"><div><span class="stat-num">2.4k</span><span class="stat-label">Circle</span></div><div><span class="stat-num">142</span><span class="stat-label">Atelier</span></div><div><span class="stat-num gold">Gold</span><span class="stat-label">Tier</span></div></div></section>
<section class="card inner-card"><div class="card-header"><h2>Inner Circle</h2><span id="onlineCount" class="badge">5 ONLINE</span></div><div id="memberList" class="member-list"></div><div class="card-footer"><p>Private • Encrypted • Invite Only</p><p>MİCHİ © 2025</p></div></section>
<p class="footnote">Curated for Founder's Circle Members Only</p>
</div></main>
<script>
const members=[{id:'1',name:'Sofia Valente',initials:'SV',role:'Atelier Noir • Milan',online:true},{id:'2',name:'Marcus Aurelien',initials:'MA',role:'Founder’s Circle • Paris',online:true},{id:'3',name:'Elena Noir',initials:'EN',role:'Private Client • London',online:true},{id:'4',name:'Julian Thorne',initials:'JT',role:'Atelier Black • New York',online:true},{id:'5',name:'Isabella Croft',initials:'IC',role:'Atelier • Dubai',online:true},{id:'6',name:'Lorenzo Vane',initials:'LV',role:'Founder’s Circle • Rome',online:false},{id:'7',name:'Aria Kensho',initials:'AK',role:'Private • Tokyo',online:false}];
const listEl=document.getElementById('memberList'),searchInput=document.getElementById('searchInput'),clearBtn=document.getElementById('clearSearch'),onlineCountEl=document.getElementById('onlineCount');
function renderMembers(f=''){const q=f.toLowerCase();const filtered=members.filter(m=>m.name.toLowerCase().includes(q)||m.role.toLowerCase().includes(q));onlineCountEl.textContent=`${members.filter(m=>m.online).length} ONLINE`;listEl.innerHTML=filtered.map(m=>`<button class="member-row"><div class="member-avatar">${m.initials}</div><div class="member-info"><div class="member-name">${m.name}</div><div class="member-role">${m.role}</div></div>${m.online?'<span class="online-dot"></span>':''}</button>`).join('');}
searchInput.addEventListener('input',e=>{const v=e.target.value;clearBtn.style.display=v?'block':'none';renderMembers(v);});
clearBtn.addEventListener('click',()=>{searchInput.value='';clearBtn.style.display='none';renderMembers('');});
renderMembers('');
</script>
</body>
</html>
