<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MICHI</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white">
<nav class="border-b border-zinc-800 p-4 flex justify-between items-center relative bg-black">
  <span class="text-xl font-bold text-yellow-500 tracking-widest">MİCHİ</span>
  <img src="./IMG_3700.jpeg" class="absolute left-1/2 -translate-x-1/2 w-10 h-10 rounded-lg border border-yellow-600">
  <button class="bg-yellow-500 text-black px-5 py-1.5 rounded-full font-bold text-sm">Post</button>
</nav>

<!-- SEARCH - English -->
<div class="max-w-2xl mx-auto p-3">
  <div class="bg-zinc-900 border border-zinc-800 rounded-full px-4 py-2.5 flex items-center gap-3">
    <span>🔍</span><input placeholder="Search in MICHI..." class="flex-1 bg-transparent outline-none text-sm">
  </div>
</div>

<!-- STORY - Add back, English -->
<div class="max-w-2xl mx-auto px-3 pb-3">
  <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-3 flex gap-4">
    <div class="text-center min-w-16">
      <div class="w-14 h-14 rounded-full bg-gradient-to-br from-yellow-400 to-yellow-600 p-0.5">
        <div class="w-full h-full rounded-full bg-black flex items-center justify-center text-yellow-500 font-bold text-xl">+</div>
      </div>
      <p class="text-xs mt-1 text-zinc-400">Add</p>
    </div>
    <div class="text-center min-w-16">
      <img src="./IMG_3700.jpeg" class="w-14 h-14 rounded-full border-2 border-yellow-500 object-cover">
      <p class="text-xs mt-1">MICHI</p>
    </div>
  </div>
</div>

<!-- POST INPUT - English -->
<div class="max-w-2xl mx-auto px-3 pb-3">
  <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-3 flex gap-3 items-center">
    <img src="./IMG_3700.jpeg" class="w-9 h-9 rounded-full border border-yellow-600">
    <input placeholder="What's on your luxury mind?" class="flex-1 bg-zinc-800 rounded-full px-4 py-2.5 text-sm outline-none">
    <button class="bg-yellow-500 text-black px-4 py-2 rounded-full font-bold text-sm">Share</button>
  </div>
</div>

<!-- POST - English -->
<div class="max-w-2xl mx-auto px-3 pb-10">
  <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-5">
    <div class="flex gap-3 items-center">
      <img src="./IMG_3700.jpeg" class="w-10 h-10 rounded-full border border-yellow-600">
      <div><p class="font-semibold text-sm">MICHI Official</p><p class="text-xs text-zinc-500">Now • Luxury</p></div>
    </div>
    <p class="mt-3 text-sm">Welcome to MICHI - Black background, Gold soul. This is luxury social. ✨</p>
  </div>
</div>

</body>
</html>
