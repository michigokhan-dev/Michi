
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>Forgot Password | MICHI</title>
  <link rel="icon" href="./michi_goldbox_icon_192.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background:#000; color:#fff; font-family:Arial,sans-serif; }
    .gold { color:#D4AF37; }
    .field {
      width:100%; background:#0b0b0b; color:#fff;
      border:1px solid #39301b; border-radius:10px;
      padding:13px; outline:none;
    }
    .field:focus { border-color:#D4AF37; }
    .gold-button {
      width:100%; background:#D4AF37; color:#000;
      padding:14px; border-radius:10px; font-weight:bold;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center px-5 py-10">
  <main class="w-full max-w-md">
    <header class="text-center mb-8">
      <img src="./michi_goldbox_icon_192.png" alt="MICHI logo"
           class="w-20 h-20 object-contain mx-auto mb-4">
      <h1 class="gold text-3xl tracking-[0.3em] font-bold">MICHI</h1>
      <h2 class="text-xl mt-8">Forgot your password?</h2>
      <p class="text-gray-400 text-sm mt-3">
        Enter your email and we'll send you a password reset link.
      </p>
    </header>

    <form id="resetForm" class="space-y-4">
      <input id="email" class="field" type="email"
             placeholder="Email address" autocomplete="email" required>
      <p id="message" class="text-sm" role="status" aria-live="polite"></p>
      <button id="resetButton" type="submit" class="gold-button">
        Send Reset Link
      </button>
    </form>

    <p class="text-center mt-6">
      <a href="./signin.html" class="gold underline">Back to Sign In</a>
    </p>
  </main>

  <script type="module">
    import { createClient } from
      'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    const SUPABASE_URL = 'https://txfusknysukvfujpiemi.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_F6BDYU87xNKou69jz6JnLA_GkU7c1x_';

    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);
    const form = document.getElementById('resetForm');
    const message = document.getElementById('message');
    const button = document.getElementById('resetButton');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      button.disabled = true;
      button.textContent = 'Sending...';
      message.textContent = '';

      try {
        const email = document.getElementById('email').value.trim();
        const { error } = await supabase.auth.resetPasswordForEmail(email, {
          redirectTo:
            'https://michigokhan-dev.github.io/Michi/reset-password.html'
        });

        if (error) throw error;

        message.textContent =
          'If an account exists for this email, a reset link will be sent.';
        message.className = 'text-sm gold';
      } catch (error) {
        message.textContent = error.message || 'Unable to send reset email.';
        message.className = 'text-sm text-red-400';
      } finally {
        button.disabled = false;
        button.textContent = 'Send Reset Link';
      }
    });
  </script>
</body>
</html>
